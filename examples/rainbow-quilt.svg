  <ellipse cx="2" cy="40" rx="62" ry="60" fill="#D7ADCA" opacity=".35" filter="url(#sq-haze)"/>
  <g filter="url(#sq-fleece)"><path d="M10 74 C18 92 36 92 40 80" stroke="#CBC2E6" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M10 68 L20 80" stroke="#CBC2E6" stroke-width="21" stroke-linecap="round" fill="none"/><circle cx="21" cy="82" r="11.5" fill="#E7E3F6"/><g transform="scale(-1 1)"><path d="M10 68 L20 80" stroke="#CBC2E6" stroke-width="21" stroke-linecap="round" fill="none"/><circle cx="21" cy="82" r="11.5" fill="#E7E3F6"/></g><ellipse cx="0" cy="56" rx="24" ry="24" fill="url(#sq-a)"/><path d="M14 46 L28 38" stroke="#CBC2E6" stroke-width="19" stroke-linecap="round" fill="none"/><circle cx="30" cy="36" r="10.5" fill="#E7E3F6"/><g transform="scale(-1 1)"><path d="M14 46 L28 38" stroke="#CBC2E6" stroke-width="19" stroke-linecap="round" fill="none"/><circle cx="30" cy="36" r="10.5" fill="#E7E3F6"/></g><path d="M8 -34 C12 -52 26 -64 39 -61 C51 -58 54 -38 50 -14 Z" fill="#CBC2E6" stroke="#CBC2E6" stroke-width="10" stroke-linejoin="round"/><g transform="scale(-1 1)"><path d="M8 -34 C12 -52 26 -64 39 -61 C51 -58 54 -38 50 -14 Z" fill="#CBC2E6" stroke="#CBC2E6" stroke-width="10" stroke-linejoin="round"/></g><ellipse cx="0" cy="0" rx="54" ry="42" fill="url(#sq-a)"/></g>
  <g filter="url(#sq-mid)"><ellipse cx="0" cy="40" rx="24" ry="5" fill="#A999C8" opacity=".55"/><ellipse cx="0" cy="60" rx="13" ry="15" fill="#F4EFFA"/><ellipse cx="-28" cy="-20" rx="16" ry="11" fill="#A999C8"/><path d="M20 -38 C24 -49 31 -54 37 -52 C43 -50 44 -41 42 -31 Z" fill="#F3C6DD"/><g transform="scale(-1 1)"><path d="M20 -38 C24 -49 31 -54 37 -52 C43 -50 44 -41 42 -31 Z" fill="#F3C6DD"/></g><ellipse cx="38" cy="15" rx="8" ry="4.5" fill="#F2B0C7" opacity=".55"/><g transform="scale(-1 1)"><ellipse cx="38" cy="15" rx="8" ry="4.5" fill="#F2B0C7" opacity=".55"/></g></g>
  
  
