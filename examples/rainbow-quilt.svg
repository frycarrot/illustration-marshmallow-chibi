  <path d="M-10 196 Q240 176 490 196" stroke="#FFFFFF" stroke-width="6" fill="none"/>
  <g filter="url(#sq-soft)"><path d="M400 218 L415.89 248.12 L449.45 253.93 L425.72 278.36 L430.56 312.07 L400 297.04 L369.44 312.07 L374.28 278.36 L350.55 253.93 L384.11 248.12 Z" fill="#FFE39F" stroke="#FFE39F" stroke-width="18" stroke-linejoin="round"/></g>
  <g filter="url(#sq-mid)"><path d="M400 240 L409.17 257.38 L428.53 260.73 L414.84 274.82 L417.63 294.27 L400 285.6 L382.37 294.27 L385.16 274.82 L371.47 260.73 L390.83 257.38 Z" fill="#FFF2CB" stroke="#FFF2CB" stroke-width="10" stroke-linejoin="round"/></g>
  <g fill="none" stroke="#695580" stroke-width="2.6" stroke-linecap="round"><path d="M391 268 Q394 271 397 268 M403 268 Q406 271 409 268"/></g>
